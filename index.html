<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Matematik Tränare</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/trig.css">
  <link rel="stylesheet" href="css/mult.css">
</head>
<body>
  <div id="app" class="app-container">
    <header class="top-bar">
      <div class="module-selectors">
        <button id="btn-mod-trig" class="nav-btn active">Trig</button>
        <button id="btn-mod-mult" class="nav-btn">Multiplikation</button>
      </div>
      <div class="stats-bar">
        <span id="streak-counter">Streak: 0</span>
        <span id="score-counter">Poäng: 0</span>
      </div>
    </header>

    <div class="step-toggle-bar">
      <button id="btn-step-1" class="step-btn active">Steg 1: Visuellt</button>
      <button id="btn-step-2" class="step-btn">Steg 2: Abstrakt</button>
    </div>

    <main class="workout-area">
      <section id="question-panel" class="question-panel">
        <span id="question-label" class="question-label">Laddar...</span>
      </section>

      <section id="visual-container" class="visual-container"></section>

      <section id="feedback-panel" class="feedback-panel"></section>

      <section id="keypad-container" class="keypad-container"></section>
    </main>
  </div>

  <script src="js/core/storage.js"></script>
  <script src="js/modules/trig/trig-data.js"></script>
  <script src="js/modules/trig/trig-visual.js"></script>
  <script src="js/modules/trig/trig-module.js"></script>
  <script src="js/modules/mult/mult-data.js"></script>
  <script src="js/modules/mult/mult-matrix.js"></script>
  <script src="js/modules/mult/mult-module.js"></script>
  <script src="js/core/app.js"></script>
</body>
</html>
